# Orkestrator, Nginx ivica (plan 15.3, 15.5): TLS, staticki fajlovi, ogranicenje brzine, log bez tokena.
#
# SABLON. Entrypoint Nginx slike zamenjuje SAMO promenljive DOMEN i DJANGO_HSTS_SEKUNDI (NGINX_ENVSUBST_FILTER u
# Dockerfile-u; envsubst menja i komentare, pa se ovde njihova imena ne pisu sa znakom dolar) i upisuje rezultat u
# /var/run/nginx.conf. Pre toga ih proverava /docker-entrypoint.d/15-provera-okruzenja.sh. Nginx promenljive ($host,
# $scheme, ...) ostaju netaknute.
# Provera: docker compose exec web nginx -t

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # ------------------------------------------------------------------ gunicorn
    # Docker DNS; ime `app` se ponovo razresava, pa nov kontejner (nova IP adresa) posle isporuke ne daje 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream orkestrator_app {
        zone orkestrator_app 64k;
        server app:8000 resolve;
    }

    # Zaglavlja ka Django-u, za sve lokacije (nijedna lokacija ne definise svoja).
    # X-Forwarded-Proto se UVEK prepisuje (django-nginx-docker, pravilo 1); ostala proxy zaglavlja od klijenta
    # se brisu: Django ne koristi X-Forwarded-Host (USE_X_FORWARDED_HOST iskljucen), gunicorn veruje samo Proto.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header Proxy "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    # gunicorn timeout je 30 s.
    proxy_read_timeout 35s;

    # CDN ili balanser ispred (DEPLOY.md, odeljak 13): bez ovoga ogranicenje brzine broji adresu CDN-a, ne igraca.
    # set_real_ip_from 203.0.113.0/24;    # opsezi CDN-a, od dobavljaca; nikad 0.0.0.0/0
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ------------------------------------------------------------------ telo zahteva (plan 15.5)
    # JSON telo igre je najvise 2 KB; Django odbija preko 16 KB (400), Nginx preko 16 KB (413).
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # ------------------------------------------------------------------ pristupni log bez tokena (plan 15.4)
    # /r/<token>/ postaje /r/-/ i u adresi i u Referer-u. Bez kolacica, bez tela zahteva.
    # Odluka ide po $uri (dekodiran i normalizovan, isti oblik po kome Nginx bira `location ^~ /r/` i Django rutu):
    # sirovi $request_uri bi propustio /%72/<token>/ ili //r/<token>/. Ostale adrese se pisu sirove ($request_uri),
    # pa i posle error_page (prijava, 429) log nosi pravu adresu.
    map $uri $zapis_uri {
        ~^/r/[^/]*(?<zapis_ostatak>.*)$     /r/-$zapis_ostatak$is_args$args;
        default                             $request_uri;
    }
    map $http_referer $zapis_referer {
        ~^(?<ref_pocetak>https?://[^/]+)/r/[^/?]*(?<ref_ostatak>.*)$    $ref_pocetak/r/-$ref_ostatak;
        default                                                         $http_referer;
    }
    log_format orkestrator '$remote_addr [$time_local] "$request_method $zapis_uri $server_protocol" '
                           '$status $body_bytes_sent $request_time "$zapis_referer" "$http_user_agent"';

    # ------------------------------------------------------------------ ogranicenje brzine (plan 15.5)
    # Granice puste skolsko odeljenje iza jednog NAT-a (30 igraca). Prazan kljuc se ne broji.
    limit_req_status 429;
    limit_conn_status 429;

    # Prijava: samo POST trosi PBKDF2 (stotine ms CPU-a), pa se samo on broji.
    map $request_method $kljuc_prijava {
        POST        $binary_remote_addr;
        default     "";
    }
    # Jedan zajednicki kljuc za sve adrese: stopa prijava na celom sajtu (plan 15.2, PBKDF2 ne sme da zauzme
    # radnike). Stopa, a ne broj istovremenih veza: limit_req se racuna PRE citanja tela, pa spor klijent ne drzi
    # zajednicko mesto (revizija S1: jedan POST sa telom od 1 bajta na 9 s blokirao bi svaku prijavu satima).
    map $request_method $kljuc_prijava_sajt {
        POST        prijava;
        default     "";
    }

    # Redovi u django_session (plan 15.5): GET / pravi sesiju bez kolacica I sa izmisljenim sessionid (Django tada
    # pravi nov kljuc), a POST /nova/ bez vazece sesije takodje. Zato su obe granice po adresi, bez obzira na kolacic,
    # i iste kao plan za nove sesije (30/min, nalet 60). Najvise 2 x 43.200 = 86.400 novih redova dnevno po adresi.
    limit_req_zone  $binary_remote_addr     zone=strana:10m         rate=30r/m;
    limit_req_zone  $binary_remote_addr     zone=nova:10m           rate=30r/m;
    limit_req_zone  $binary_remote_addr     zone=potez:10m          rate=10r/s;
    limit_req_zone  $binary_remote_addr     zone=akcije:10m         rate=2r/s;
    limit_req_zone  $binary_remote_addr     zone=deljeno:10m        rate=5r/s;
    limit_req_zone  $kljuc_prijava          zone=prijava:10m        rate=6r/m;
    limit_req_zone  $kljuc_prijava_sajt     zone=prijava_sajt:1m    rate=2r/s;
    limit_req_zone  $binary_remote_addr     zone=moderator:10m      rate=5r/s;
    limit_req_zone  $binary_remote_addr     zone=ostalo:10m         rate=5r/s;
    # Javna rang lista za partnere: po adresi, 1 zahtev u sekundi, nalet 10 (visak 429). Odgovor se kesira 60 s.
    limit_req_zone  $binary_remote_addr     zone=api:10m            rate=1r/s;
    # Spor POST na prijavu drzi samo vezu svoje adrese, najvise 3 (dva moderatora iza istog NAT-a prolaze).
    limit_conn_zone $kljuc_prijava          zone=prijava_veze:10m;

    # ------------------------------------------------------------------ nepoznat Host (plan 15.3)
    # Veza se zatvara bez odgovora (444); Django ga ni ne vidi.
    server {
        listen 80 default_server;
        server_name _;
        access_log off;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        # Nepoznat SNI: TLS se odbija pre sertifikata; poznat SNI sa tudjim Host-om stize ovde i dobija 444.
        ssl_reject_handshake on;
        access_log off;
        return 444;
    }

    # ------------------------------------------------------------------ http: ACME i 301
    server {
        listen 80;
        server_name ${DOMEN};
        access_log /var/log/nginx/pristup/pristup.log orkestrator;

        # Let's Encrypt HTTP-01 (certbot --webroot, DEPLOY.md korak 4).
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://${DOMEN}$request_uri;
        }
    }

    # ------------------------------------------------------------------ https
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMEN};
        access_log /var/log/nginx/pristup/pristup.log orkestrator;

        # Simbolicke veze postavlja /docker-entrypoint.d/25-tls-sertifikat.sh (Dockerfile):
        # Let's Encrypt iz /etc/letsencrypt/live/<domen>/, inace privremeni samopotpisani.
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # HSTS salje Django (DJANGO_HSTS_SEKUNDI), jedno mesto za oba koraka (DEPLOY.md, 11); iz iste promenljive
        # ga Nginx dodaje samo na svoju stranu 429 prijave (@prijava_429).

        # Nijedna forma ni fetch ne salje multipart (plan 15.5); druga linija uz Django 6.0.8 (CVE-2026-33033).
        if ($content_type ~* ^multipart/) {
            return 415;
        }

        root /srv;

        # Statika direktno sa diska, bez gunicorn-a (django-nginx-docker). Skupljena u gradnji slike.
        location ^~ /static/ {
            access_log off;
            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_types text/css application/javascript text/javascript image/svg+xml;
            # igra.js i igra.css: pregledac uvek proverava ETag, pa posle isporuke niko ne ostaje na staroj skripti.
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;

            # Verzija je u imenu datoteke, pa se cuva godinu dana.
            location ~ ^/static/igra/bootstrap-[0-9.]+\.min\.css$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header X-Content-Type-Options nosniff always;
            }
        }

        location = /robots.txt {
            access_log off;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 404;
        }

        # GET / moze da napravi red u django_session (plan 15.5): 30 u minuti po adresi, nalet 60.
        location = / {
            limit_req zone=strana burst=60 nodelay;
            proxy_pass http://orkestrator_app;
        }

        location = /potez/ {
            limit_req zone=potez burst=60 nodelay;
            proxy_pass http://orkestrator_app;
        }

        # Nova igra bez vazece sesije pravi red u django_session: kao GET /, 30 u minuti po adresi, nalet 60.
        location = /nova/ {
            limit_req zone=nova burst=60 nodelay;
            proxy_pass http://orkestrator_app;
        }

        # /prijavi/ (prijava neprikladnog imena) deli zonu. Prijavu upisuje samo sesija sa partijom, jednom po redu
        # liste, a novu sesiju prave samo GET strane igre i POST /nova/ (zone `strana` i `nova`): broj prijava jednog
        # reda sa jedne adrese ogranicavaju te dve zone, a ukupan broj po redu aplikacija (PRIJAVA_NAJVISE).
        location ~ ^/(sacuvaj|podeli|jezik|prijavi)/$ {
            limit_req zone=akcije burst=30 nodelay;
            proxy_pass http://orkestrator_app;
        }

        # Dnevni izazov: iste zone kao odgovarajuce obicne rute, pa brojaci po adresi ostaju zajednicki.
        # GET /dnevni/ pravi sesiju kao GET / i deli zonu `strana`: zbir oba ostaje 30 u minuti po adresi, pa
        # granica novih redova u django_session (komentar uz limit_req_zone) se ne menja. Nema /dnevni/nova/.
        location = /dnevni/ {
            limit_req zone=strana burst=60 nodelay;
            proxy_pass http://orkestrator_app;
        }

        location = /dnevni/potez/ {
            limit_req zone=potez burst=60 nodelay;
            proxy_pass http://orkestrator_app;
        }

        location ~ ^/dnevni/(sacuvaj|podeli)/$ {
            limit_req zone=akcije burst=30 nodelay;
            proxy_pass http://orkestrator_app;
        }

        # Javna rang lista (JSON, bez sesije i kolacica): posebna zona po adresi, proxy kao /zdravlje/.
        location = /api/rang-lista/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://orkestrator_app;
        }

        location ^~ /r/ {
            limit_req zone=deljeno burst=30 nodelay;
            # Poruke dnevnika gresaka nose sirovu adresu sa tokenom; ovde samo kriticne.
            error_log stderr crit;
            proxy_pass http://orkestrator_app;
        }

        # Sedma prijava u minuti sa iste adrese daje 429. Na celom sajtu 2 prijave u sekundi: visak se ODLAZE
        # (bez nodelay, najvise 5 u redu, cekanje do 2,5 s), tek preko toga 429. PBKDF2 tako u proseku zauzima
        # najvise jednog od 4 radnika, a dva moderatora u istoj sekundi prolaze.
        location = /moderator/prijava/ {
            limit_req zone=prijava burst=5 nodelay;
            limit_req zone=prijava_sajt burst=5;
            limit_req zone=moderator burst=20 nodelay;
            limit_conn prijava_veze 3;
            # Forma prijave je ispod 1 KB; krace cekanje izmedju dva citanja tela nego za ostatak sajta.
            client_max_body_size 4k;
            client_body_timeout 5s;
            error_page 429 @prijava_429;
            proxy_pass http://orkestrator_app;
        }

        # 429 na prijavi: nasa dvojezicna strana iz slike, ne gola strana Nginx-a. Imenovana lokacija cuva metod
        # i adresu, pa log pise "POST /moderator/prijava/ ... 429". Raspored kao templates/404.html (zaglavlje sa
        # znakom; ikona je ovde ugradjeni <symbol>, bez skripte). Telo je staticko (ne ponavlja nista iz zahteva) i
        # bez apostrofa i znaka dolar: apostrof zavrsava niz, a dolar bi Nginx citao kao promenljivu.
        # HSTS: odgovor ne ide kroz Django, pa ga salje Nginx, sa istom vrednoscu (DJANGO_HSTS_SEKUNDI iz .env,
        # sablon ga renderuje uz DOMEN, posle provere u 15-provera-okruzenja.sh: samo cifre, vece od 0) i bez
        # includeSubDomains/preload, kao Django. Referrer-Policy i COOP isti kao Django (settings.py).
        location @prijava_429 {
            default_type text/html;
            charset utf-8;
            add_header Strict-Transport-Security "max-age=${DJANGO_HSTS_SEKUNDI}" always;
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
            return 429 '<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Превише покушаја · Too many attempts · Оркестратор</title>
  <link rel="icon" href="data:,">
  <link href="/static/igra/bootstrap-5.3.8.min.css" rel="stylesheet">
  <link href="/static/igra/igra.css" rel="stylesheet">
</head>
<body class="igra-telo">
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="ik-znak" viewBox="0 0 24 24"><path d="M12 7.500v4M12 11.500H6v5M12 11.500h6v5"/><circle class="ia" cx="12" cy="5" r="2.800"/><circle class="ia" cx="6" cy="19" r="2.800"/><circle class="ia" cx="18" cy="19" r="2.800"/></symbol>
  </defs>
</svg>
<div class="container igra-okvir">
  <div class="row">
    <div class="col-12 col-lg-10 col-xl-8 mx-auto">

      <header class="vrh">
        <div class="vrh-naslov">
          <span class="znak"><svg class="ik" aria-hidden="true" focusable="false"><use href="#ik-znak"/></svg></span>
          <div class="vrh-tekst">
            <p class="naslov">Оркестратор</p>
          </div>
        </div>
      </header>

      <main>
        <section class="nedostupno">
          <h1 class="nedostupno-naslov">Превише покушаја пријаве.</h1>
          <p class="nedostupno-pomoc">Сачекајте један минут, па покушајте поново.</p>
        </section>
        <section class="nedostupno" lang="en">
          <h2 class="nedostupno-naslov">Too many sign-in attempts.</h2>
          <p class="nedostupno-pomoc">Wait one minute, then try again.</p>
        </section>
        <a class="btn dugme dugme-glavno" href="/moderator/prijava/"><span><span class="text-nowrap">Пријава модератора</span> · <span class="text-nowrap" lang="en">Moderator sign-in</span></span></a>
      </main>

    </div>
  </div>
</div>
</body>
</html>
';
        }

        location ^~ /moderator/ {
            limit_req zone=moderator burst=20 nodelay;
            proxy_pass http://orkestrator_app;
        }

        # Ostalo, i /zdravlje/ za spoljnu proveru (1-5 min).
        location / {
            limit_req zone=ostalo burst=20 nodelay;
            proxy_pass http://orkestrator_app;
        }
    }
}
