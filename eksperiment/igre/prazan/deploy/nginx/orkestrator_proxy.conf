# Prosledjivanje gunicornu. Kopirati u /etc/nginx/orkestrator_proxy.conf.
# X-Forwarded-Proto se uvek prepisuje, pa ga klijent ne moze lazirati (Django mu veruje).
proxy_pass http://orkestrator;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_redirect off;
proxy_read_timeout 35s;
