# Nginx za https://orkestrator.example. Kopirati u /etc/nginx/sites-available/orkestrator
# i ukljuciti (vidi deploy/UPUTSTVO.md, korak 7). Ako domen nije orkestrator.example,
# zameniti ga svuda u ovoj datoteci i u ORKESTRATOR_DOMEN.

# Ogranicenja po IP adresi. Igrac salje jedan POST po potezu, pa ga ovo nikad ne zaustavi;
# zaustavlja skripte koje bi masovno pravile partije ili upisivale rezultate.
map $request_method $orkestrator_upis {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $orkestrator_upis    zone=orkestrator_upis:10m    rate=10r/s;
limit_req_zone $binary_remote_addr  zone=orkestrator_prijava:10m rate=10r/m;
# Javna rang lista za partnere (JSON): dovoljno za proveru svakih nekoliko sekundi.
limit_req_zone $binary_remote_addr  zone=orkestrator_api:10m     rate=2r/s;

upstream orkestrator {
    server unix:/run/orkestrator/gunicorn.sock fail_timeout=0;
}

# HTTP samo preusmerava na HTTPS (i propusta proveru za Let's Encrypt sertifikat).
server {
    listen 80;
    listen [::]:80;
    server_name orkestrator.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://orkestrator.example$request_uri;
    }
}

server {
    # Oblik "listen ... http2" radi i na nginx 1.22/1.24 (Debian 12, Ubuntu 24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orkestrator.example;

    ssl_certificate     /etc/letsencrypt/live/orkestrator.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orkestrator.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:orkestrator_ssl:10m;
    ssl_session_timeout 1d;

    # Najveci zahtev igre je nekoliko stotina bajtova.
    client_max_body_size 16k;
    limit_req_status 429;

    # Staticke datoteke: imena nose hes sadrzaja, pa se kesiraju godinu dana.
    location /static/ {
        alias /srv/orkestrator/static/;
        access_log off;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Prijava moderatora: najvise 10 pokusaja u minuti sa jedne adrese.
    location = /moderator/prijava/ {
        limit_req zone=orkestrator_prijava burst=5 nodelay;
        include /etc/nginx/orkestrator_proxy.conf;
    }

    # Javna rang lista: odgovor nosi Cache-Control od 60 s, pa partneri ne moraju cesce.
    location = /api/rang-lista/ {
        limit_req zone=orkestrator_api burst=20 nodelay;
        include /etc/nginx/orkestrator_proxy.conf;
    }

    location / {
        # Rezerva od 50 zahteva za vise igraca iza iste adrese (skola, firma).
        limit_req zone=orkestrator_upis burst=50 nodelay;
        include /etc/nginx/orkestrator_proxy.conf;
    }
}

# Zahtevi za bilo koji drugi naziv servera se odbijaju bez odgovora.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    return 444;
}
